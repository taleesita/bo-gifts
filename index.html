<style>
body { font-family: system-ui, -apple-system, sans-serif; margin: 0; -webkit-tap-highlight-color: transparent }
.tab-active { border-bottom: 3px solid #28364e; color: #28364e; font-weight: 600 }

<body class="bg-cream-50 min-h-screen text-gray-800">

<header class="bg-white border-b border-cream-200 sticky top-0 z-40" style="display:none">
  <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <img src="icon-192.png" alt="" class="w-8 h-8 rounded-lg">
      <h1 class="text-xl font-bold text-navy-700">Bo Gifts</h1>
    </div>
    <div class="relative">
      <button onclick="toggleGearMenu()" id="gearBtn" class="text-gray-400 hover:text-navy-700 text-xl px-1" title="Settings">&#9881;</button>
      <div id="gearMenu" class="hidden absolute right-0 top-10 bg-white border rounded-lg shadow-lg py-2 w-56 z-50">
        <div id="gearUser" class="px-4 py-2 text-xs text-gray-400 border-b">Not signed in</div>
        <button onclick="exportCSV();toggleGearMenu()" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-cream-100">&#8681; Export all to CSV</button>
        <button id="gearSignOut" onclick="doSignOut();toggleGearMenu()" class="hidden w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50">Sign out</button>
      </div>
    </div>
  </div>
</header>

<div id="appContent" style="display:none">
  <nav class="bg-white border-b border-cream-200">
    <div class="max-w-4xl mx-auto px-4 flex gap-6">
      <button class="tab py-3 text-sm" data-tab="received" onclick="switchTab('received')">Received</button>
      <button class="tab py-3 text-sm" data-tab="given" onclick="switchTab('given')">Given</button>
      <button class="tab py-3 text-sm" data-tab="people" onclick="switchTab('people')">By Person</button>
    </div>
  </nav>

  <div class="bg-navy-700 text-white">
    <div class="max-w-4xl mx-auto px-4 py-4 grid grid-cols-3 gap-4 text-center" id="summary"></div>
  </div>

  <div class="max-w-4xl mx-auto px-4 pt-4">
    <div class="flex flex-wrap gap-2 items-center">
      <input id="search" type="search" placeholder="Search person, gift, occasion…" oninput="render()" class="flex-1 min-w-[180px] px-3 py-2 border border-cream-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-navy-300">
      <select id="occFilter" onchange="render()" class="px-3 py-2 border border-cream-300 rounded-lg bg-white text-sm max-w-[180px]"></select>
      <select id="sideFilter" onchange="render()" class="px-3 py-2 border border-cream-300 rounded-lg bg-white text-sm max-w-[180px]">
        <option value="">All sides</option><option value="TalyMom">Taly – Mom's side</option><option value="TalyDad">Taly – Dad's side</option><option value="Taly">Taly</option><option value="Doug">Doug family</option><option value="Both">Both</option><option value="none">No side set</option>
      </select>
      <button id="tyFilterBtn" onclick="toggleTyFilter()" class="px-3 py-2 border rounded-lg text-sm whitespace-nowrap">&#9993;&#65039; Thank-you pending</button>
      <button id="addBtn" onclick="openForm()" class="px-4 py-2 bg-navy-700 text-white rounded-lg text-sm font-medium hover:bg-navy-800 whitespace-nowrap">+ Add gift</button>
    </div>
  </div>

  <main class="max-w-4xl mx-auto px-4 py-4 pb-24" id="main"></main>
</div>

<!-- Login -->
<div id="loginScreen" style="display:none" class="flex flex-col items-center justify-center py-20 px-4 text-center">
  <img src="icon-512.png" alt="" class="w-28 h-28 mb-5 drop-shadow">
  <h1 class="text-2xl font-bold text-navy-700 mb-2">Bo Gifts</h1>
  <p class="text-gray-500 text-sm mb-8">Gifts given &amp; received, all in one place</p>
  <button onclick="doSignIn()" class="px-6 py-3 bg-navy-700 text-white rounded-lg text-sm font-medium hover:bg-navy-800 flex items-center gap-2">
    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Sign in with Google</button>
  <p id="loginErr" class="text-red-600 text-sm mt-4"></p>
</div>

<!-- Not configured -->
<div id="setupScreen" style="display:none" class="max-w-md mx-auto py-20 px-4 text-center">
  <h1 class="text-2xl font-bold text-navy-700 mb-2">Bo Gifts</h1>
  <p class="text-gray-600 text-sm">Firebase isn't configured yet. Paste your Firebase config into <b>deploy.html</b> and deploy again (see SETUP.md).</p>
</div>

<!-- Add / edit modal -->
<div id="modal" class="hidden fixed inset-0 modal-bg z-50 flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeForm()">
  <div class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-xl max-h-[92vh] overflow-y-auto">
    <div class="px-5 py-4 border-b flex justify-between items-center sticky top-0 bg-white">
      <h2 id="formTitle" class="font-bold text-navy-700 text-lg">Add gift</h2>
      <button onclick="closeForm()" class="text-gray-400 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-5 py-4 space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-600" id="fPersonLabel">From</label>
        <input id="fPerson" list="peopleList" dir="auto" oninput="renderHint()" class="w-full px-3 py-2 border rounded-lg" placeholder="Name(s)">
        <div id="fHint" class="mt-2"></div>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600">Occasion</label>
        <input id="fOccasion" list="occList" class="w-full px-3 py-2 border rounded-lg" placeholder="e.g. Our Wedding, Noa's Birth, Sam's Bar Mitzvah">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600">Gift / item</label>
        <input id="fGift" dir="auto" class="w-full px-3 py-2 border rounded-lg" placeholder="e.g. Cash, Check, Lovevery Play Gym">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div class="col-span-2">
          <label class="text-xs font-semibold text-gray-600">Amount / value <span class="font-normal text-gray-400">(optional)</span></label>
          <input id="fAmount" type="number" inputmode="decimal" min="0" step="any" class="w-full px-3 py-2 border rounded-lg" placeholder="0">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Currency</label>
          <select id="fCurrency" class="w-full px-2 py-2 border rounded-lg bg-white">
            <option value="USD">$ USD</option><option value="ILS">&#8362; ILS</option><option value="EUR">&euro; EUR</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-gray-600">Date <span class="font-normal text-gray-400">(optional)</span></label>
          <input id="fDate" type="date" class="w-full px-3 py-2 border rounded-lg bg-white">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Family / side</label>
          <select id="fSide" class="w-full px-2 py-2 border rounded-lg bg-white">
            <option value="">—</option><option value="TalyMom">Taly – Mom's side</option><option value="TalyDad">Taly – Dad's side</option><option value="Taly">Taly</option><option value="Doug">Doug family</option><option value="Both">Both</option>
          </select>
        </div>
      </div>
      <div id="fAttWrap">
        <label class="text-xs font-semibold text-gray-600">Attended?</label>
        <select id="fAttended" class="w-full px-2 py-2 border rounded-lg bg-white">
          <option value="">—</option><option value="yes">Attended</option><option value="no">Didn't attend</option>
        </select>
      </div>
      <div id="fTyWrap">
        <label class="text-xs font-semibold text-gray-600">Thank-you note</label>
        <div class="flex gap-2 mt-1" id="fTy">
          <button type="button" data-v="no" class="ty-opt flex-1 py-2 border rounded-lg text-sm">Not yet</button>
          <button type="button" data-v="yes" class="ty-opt flex-1 py-2 border rounded-lg text-sm">Sent &#9989;</button>
          <button type="button" data-v="na" class="ty-opt flex-1 py-2 border rounded-lg text-sm">N/A</button>
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600">Notes</label>
        <textarea id="fNotes" rows="2" dir="auto" class="w-full px-3 py-2 border rounded-lg" placeholder="Anything worth remembering"></textarea>
      </div>
    </div>
    <div class="px-5 py-4 border-t flex gap-2 sticky bottom-0 bg-white">
      <button id="fDelete" onclick="deleteEntry()" class="px-4 py-2 text-red-600 border border-red-200 rounded-lg text-sm hover:bg-red-50">Delete</button>
      <div class="flex-1"></div>
      <button onclick="closeForm()" class="px-4 py-2 border rounded-lg text-sm">Cancel</button>
      <button onclick="saveEntry()" class="px-5 py-2 bg-navy-700 text-white rounded-lg text-sm font-medium hover:bg-navy-800">Save</button>
    </div>
  </div>
</div>
<datalist id="peopleList"></datalist>
<datalist id="occList"></datalist>

<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-navy-800 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50"></div>

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s) { return String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim(); }
// Names related to `name`: direct matches, plus names that match those (one step), e.g.
// "Pauline & Warren" -> "Pauline Tran & Warren Mak" -> "Pauline Tran"
function relatedNameSet(name) {
  var all = {}; received.concat(given).forEach(function(e) { if (e.person) all[norm(e.person)] = e.person; });
  var first = Object.keys(all).filter(function(k) { return namesMatch(all[k], name); });
  var set = {}; set[norm(name)] = 1; first.forEach(function(k) { set[k] = 1; });
  first.forEach(function(k) { Object.keys(all).forEach(function(k2) { if (!set[k2] && namesMatch(all[k2], all[k])) set[k2] = 1; }); });
  return set;
}
function nameTokens(s) { return norm(s).split(' ').filter(function(t) { return t && t !== 'and' && t !== 'the'; }); }

  var na = norm(a), nb = norm(b); if (!na || !nb) return false;
  if (na === nb || na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0) return true;
  var ta = nameTokens(a), tb = nameTokens(b), shared = ta.filter(function(t) { return tb.indexOf(t) >= 0; }).length;
  var shorter = Math.min(ta.length, tb.length);
  return (shorter > 0 && shared === shorter) || shared >= 2;
}

var FX = { USD: 1, ILS: 0.27, EUR: 1.08 }; // rough, only used to sort mixed currencies
var SIDE_ORDER = { TalyMom: 1, TalyDad: 2, Taly: 3, Doug: 4, Both: 5 };
function compareEntries(a, b) {
  var c = sortState.col, d = sortState.dir, r = 0;
  function blankLast(x, y) { return x === y ? 0 : x == null ? 1 : y == null ? -1 : null; }
  if (c === 'amount') {
    var x = a.amount != null && a.amount !== '' ? Number(a.amount) * (FX[a.currency] || 1) : null;
    var y = b.amount != null && b.amount !== '' ? Number(b.amount) * (FX[b.currency] || 1) : null;
    var bl = blankLast(x, y); r = bl !== null ? bl : (x - y) * d;
  } else if (c === 'side') {
    var sx = SIDE_ORDER[a.side] || null, sy = SIDE_ORDER[b.side] || null;
    var bl2 = blankLast(sx, sy); r = bl2 !== null ? bl2 : (sx - sy) * d;
  } else if (c === 'thanked') {
    var o = { no: 0, yes: 1, na: 2 }; r = ((o[a.thankYou] || 2) - (o[b.thankYou] || 2)) * d;
  } else if (c === 'date') {
    var dx = a.date || null, dy = b.date || null, bl4 = blankLast(dx, dy); r = bl4 !== null ? bl4 : dx.localeCompare(dy) * d;
  } else if (c === 'gift') {
    var gx = hasGift(a) ? (a.gift || '').toLowerCase() : null, gy = hasGift(b) ? (b.gift || '').toLowerCase() : null;
    var bl3 = blankLast(gx, gy); r = bl3 !== null ? bl3 : gx.localeCompare(gy) * d;

}
function setSort(col) {

function renderList() {

function goPerson(key) {

  try { localStorage.setItem('boGiftsTab', 'people'); } catch(e) {}
  render(); window.scrollTo(0, 0);
}
function renderPeople() {
  if (!_dataLoaded) { $('main').innerHTML = '<div class="text-center text-gray-400 py-16 text-sm">Loading…</div>'; return; }
  var q = norm($('search').value);
  var people = {};
  function add(e, kind) {
    var k = norm(e.person); if (!k) return;
    var p = people[k] = people[k] || { key: k, name: e.person, rec: [], giv: [] };

  }

  given.forEach(function(e) { add(e, 'giv'); });

    .filter(function(p) { return !q || p.key.indexOf(q) >= 0 || (openPerson && p.key === openPerson); })
    .sort(function(a, b) { return a.name.localeCompare(b.name); });

  }

    h += '<div class="flex-1 min-w-0 font-semibold text-gray-900" dir="auto">' + esc(p.name) + '</div>';

  var same = editing.list === 'given' ? given : received;

function saveEntry() {
  var person = $('fPerson').value.trim();
  if (!person) { $('fPerson').focus(); toast('Add a name'); return; }
  var amt = $('fAmount').value.trim();
  var data = {
    person: person,
    occasion: $('fOccasion').value.trim(),
    gift: $('fGift').value.trim(),
    amount: amt === '' ? null : Number(amt),
    currency: $('fCurrency').value,
    date: ($('fDate').value && $('fDate').value === $('fDate').dataset.orig + '-01') ? $('fDate').dataset.orig : ($('fDate').value || ''),

  if (editing.list === 'received') { data.thankYou = formTy; data.attended = $('fAttended').value; }
  var list = editing.list === 'given' ? given : received;
  if (editing.id) {
    var e = list.find(function(x) { return x.id === editing.id; });
    Object.assign(e, data, { updatedAt: Date.now() });
  } else {
    data.id = uid(); data.createdAt = Date.now(); data.createdBy = currentUser ? currentUser.email : '';

// ====== EXPORT ======
function exportCSV() {
  var cols = ['Type', 'Person', 'Occasion', 'Month', 'Gift', 'Amount', 'Currency', 'Side', 'Attended', 'Thank-you', 'Notes'];
  function q(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  var rows = [cols.join(',')];
  received.forEach(function(e) { rows.push(['Received', e.person, e.occasion, e.date, e.gift, e.amount, e.currency, sideLabel(e.side), {yes:'Yes',no:'No'}[e.attended] || '', {yes:'Sent',no:'Not yet',na:'N/A'}[e.thankYou] || '', e.notes].map(q).join(',')); });
  given.forEach(function(e) { rows.push(['Given', e.person, e.occasion, e.date, e.gift, e.amount, e.currency, sideLabel(e.side), '', '', e.notes].map(q).join(',')); });
  var blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'bo-gifts-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

// ====== PWA ======
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function(e) { console.log('SW error', e); });
}
</script>
